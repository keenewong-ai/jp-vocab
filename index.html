<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <title>Keene 日語生字 · Memo 卡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">日</div>
        <div>
          <h1>Keene 日語生字</h1>
          <p>生字表 · Memo 卡 · 日文朗讀</p>
        </div>
      </div>
      <div class="stats-pill" title="生字總數">
        共 <strong id="total-count">—</strong> 個生字
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button type="button" class="tab active" data-panel="panel-list" role="tab" aria-selected="true">生字表</button>
      <button type="button" class="tab" data-panel="panel-flash" role="tab" aria-selected="false">Memo 卡</button>
    </nav>

    <!-- List panel -->
    <section id="panel-list" class="panel active" role="tabpanel">
      <div class="search-bar">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input id="search" type="search" placeholder="搜尋日文或中文…" autocomplete="off" enterkeyhint="search" />
      </div>
      <div class="search-meta">
        <span id="search-count">載入中…</span>
        <label class="sort-label">
          排序
          <select id="list-sort" aria-label="生字表排序">
            <option value="id">預設（編號）</option>
            <option value="added_desc">加入日期（新→舊）</option>
            <option value="added_asc">加入日期（舊→新）</option>
          </select>
        </label>
      </div>
      <ul id="word-list" class="word-list" aria-label="生字列表"></ul>

      <div id="detail" class="detail" aria-live="polite">
        <div class="detail-top">
          <div>
            <div id="detail-jp" class="jp"></div>
            <div id="detail-zh" class="zh"></div>
            <div id="detail-added" class="detail-added"></div>
          </div>
          <button type="button" id="detail-speak" class="icon-btn" title="讀出日文" aria-label="讀出日文">🔊</button>
        </div>
      </div>
    </section>

    <!-- Flashcard panel -->
    <section id="panel-flash" class="panel" role="tabpanel">
      <div class="flash-toolbar">
        <div class="progress-text" id="flash-progress"><strong>1</strong> / —</div>
        <div style="display:flex;gap:0.4rem;flex-wrap:wrap">
          <button type="button" id="btn-autoplay" class="btn btn-autoplay" aria-pressed="false">▶ 自動播放</button>
          <button type="button" id="btn-romaji" class="btn btn-ghost btn-romaji" aria-pressed="false" title="顯示／隱藏羅馬字讀音">あ→a</button>
          <button type="button" id="btn-shuffle" class="btn btn-ghost">🔀 洗牌</button>
          <button type="button" id="btn-restart" class="btn btn-ghost">↺ 重頭</button>
        </div>
      </div>

      <div class="filter-bar" role="group" aria-label="Memo 卡篩選">
        <button type="button" class="filter-chip active" data-filter="all" aria-pressed="true">全部</button>
        <button type="button" class="filter-chip" data-filter="focus" aria-pressed="false">★ 只睇重點關注</button>
        <button type="button" class="filter-chip" data-filter="unfocus" aria-pressed="false">☆ 未關注</button>
        <label class="sort-label flash-sort">
          排序
          <select id="flash-sort" aria-label="Memo 卡排序">
            <option value="id">預設（編號）</option>
            <option value="added_desc">加入日期（新→舊）</option>
            <option value="added_asc">加入日期（舊→新）</option>
          </select>
        </label>
        <span id="sync-status" class="sync-status" role="status" aria-live="polite" title="重點關注雲端同步">同步中…</span>
      </div>

      <div class="progress-bar" aria-hidden="true"><div id="progress-fill" class="progress-fill"></div></div>

      <div id="autoplay-status" class="autoplay-status" hidden role="status" aria-live="polite">
        <span class="autoplay-dot" aria-hidden="true"></span>
        <span id="autoplay-status-text">自動播放中…</span>
      </div>

      <div id="flash-empty" class="flash-empty" hidden>
        <div id="flash-empty-icon" class="flash-empty-icon" aria-hidden="true">★</div>
        <p id="flash-empty-title" class="flash-empty-title">未有重點關注嘅生字</p>
        <p id="flash-empty-desc" class="flash-empty-desc">喺「全部」模式撳「重點關注」標記生字，之後就可以喺呢度溫習。</p>
        <button type="button" id="btn-show-all" class="btn btn-ghost">睇返全部</button>
      </div>

      <div id="flash-main">
        <div class="card-stage">
          <div id="flash-card" class="flash-card" role="button" tabindex="0" aria-label="Memo 卡：手機點擊讀日文，左右滑翻轉；電腦點擊翻轉">
            <button type="button" id="card-speak" class="icon-btn card-speak" title="讀出日文" aria-label="讀出日文">🔊</button>
            <div class="card-face front">
              <span class="card-label">日文</span>
              <div id="card-jp" class="card-jp">…</div>
              <div id="card-romaji" class="card-romaji" hidden lang="ja-Latn"></div>
              <span class="card-hint card-hint-desktop">點卡片翻轉 · 空白鍵亦可</span>
              <span class="card-hint card-hint-touch">點卡片讀日文 · 左右滑翻轉</span>
            </div>
            <div class="card-face back">
              <span class="card-label">意思</span>
              <div id="card-zh" class="card-zh">…</div>
              <span class="card-hint card-hint-desktop">再點一次翻返去</span>
              <span class="card-hint card-hint-touch">左右滑翻返去 · 點擊再讀日文</span>
            </div>
          </div>
        </div>

        <div class="flash-controls">
          <button type="button" id="btn-prev" class="btn btn-nav" aria-label="上一張" title="上一張">
            <svg class="nav-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
            </svg>
          </button>
          <button type="button" id="btn-focus" class="btn btn-focus">☆ 重點關注</button>
          <button type="button" id="btn-next" class="btn btn-nav" aria-label="下一張" title="下一張">
            <svg class="nav-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
            </svg>
          </button>
        </div>
      </div>

      <p id="tts-note" class="tts-note" role="status"></p>
    </section>

  </div>
  <script src="app.js"></script>
</body>
</html>
